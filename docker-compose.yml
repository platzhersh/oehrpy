# Local CDRs for integration tests.
#
#   docker compose up -d                                # EHRBase on :8080 (default)
#   docker compose --profile ferroehr up -d ferroehr    # FerroEHR on :8081
#   docker compose --profile ferroehr up -d             # both
#
# FerroEHR is BSL 1.1 licensed; running it locally/in CI for testing is
# non-commercial use. oehrpy only talks to it over REST.
version: '3.8'

services:
  postgres:
    image: ehrbase/ehrbase-v2-postgres:16.2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ehrbase:
    image: ehrbase/ehrbase:2.26.0
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ehrbase
      DB_USER: ehrbase
      DB_PASS: ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      SECURITY_AUTHTYPE: BASIC
      SECURITY_AUTHUSER: ehrbase-user
      SECURITY_AUTHPASSWORD: SuperSecretPassword
      SECURITY_AUTHADMINUSER: ehrbase-admin
      SECURITY_AUTHADMINPASSWORD: EvenMoreSecretPassword
      ADMIN_API_ACTIVE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ehrbase/rest/status"]
      interval: 10s
      timeout: 5s
      retries: 15

  ferroehr-postgres:
    profiles: [ferroehr]
    image: ghcr.io/rubentalstra/ferroehr-postgres:4.3.1
    environment:
      POSTGRES_PASSWORD: postgres
      PG_INIT_USER: ferroehr
      PG_INIT_PASSWORD: ferroehr
      PG_INIT_DB: ferroehr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferroehr -d ferroehr"]
      interval: 5s
      timeout: 5s
      retries: 20

  ferroehr:
    profiles: [ferroehr]
    image: ghcr.io/rubentalstra/ferroehr:4.3.1
    environment:
      FERROEHR__DB__URL: postgres://ferroehr:ferroehr@ferroehr-postgres:5432/ferroehr
      FERROEHR__LOG__FORMAT: pretty
    configs:
      - source: ferroehr-config
        target: /etc/ferroehr/ferroehr.toml
    ports:
      - "8081:8080"
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

configs:
  # Test posture: RBAC on, admin API mounted, three Basic users (all with
  # password "ferroehr") and a dev-only HS256 OIDC issuer for bearer tests.
  ferroehr-config:
    content: |
      [server]
      bind = "0.0.0.0:8080"
      [admin]
      enabled = true
      [auth]
      enabled = true
      [[auth.basic.users]]
      username = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      roles = ["USER"]
      [[auth.basic.users]]
      username = "ferroehr-admin"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      roles = ["ADMIN", "USER"]
      [[auth.basic.users]]
      username = "ferroehr-readonly"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      roles = ["READONLY"]
      [auth.oidc]
      issuer = "http://oehrpy.test"
      allow_insecure_issuer = true
      audiences = ["ferroehr"]
      algorithms = ["HS256"]
      hmac_secret = "oehrpy-dev-hmac-secret-not-for-production"

volumes:
  postgres_data:
